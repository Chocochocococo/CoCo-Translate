<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>CoCo Translate</title>
  <!-- theme.js 要最先跑，打開時才不會先閃一下白色 -->
  <script src="theme.js"></script>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon-48.png" alt="" class="logo">
    <div class="title-block">
      <div class="title" data-i18n="appName">CoCo Translate</div>
      <div id="siteHost" class="site"></div>
    </div>
    <button id="themeToggle" class="icon-btn" type="button">
      <svg class="theme-icon theme-auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
      <svg class="theme-icon theme-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></g></svg>
      <svg class="theme-icon theme-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="currentColor"/></svg>
    </button>
    <button id="openOptionsBtn" class="icon-btn" type="button" data-i18n-title="openSettings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.47.47 0 0 0-.47.41l-.36 2.54a7.3 7.3 0 0 0-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54a7 7 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.47.47 0 0 0-.12-.61zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg>
    </button>
  </header>

  <button id="pageToggleBtn" class="primary" type="button">
    <span id="pageToggleLabel" data-i18n="translatePage">翻譯此頁</span>
    <small id="pageShortcut"></small>
  </button>

  <div id="displayMode" class="segmented display-mode">
    <button type="button" data-value="replace" data-i18n="displayReplace">取代原文</button>
    <button type="button" data-value="bilingual" data-i18n="displayBilingual">雙語對照</button>
  </div>

  <div class="card">
    <label class="row">
      <span class="icon">🌐</span>
      <span class="label" data-i18n="pageSource">翻譯來源</span>
      <span class="pill">
        <select id="pageSource">
          <option value="google" data-i18n="sourceGoogle">Google 翻譯</option>
          <option value="google-api" data-i18n="sourceGoogleApi">Google Cloud API</option>
          <option value="bing" data-i18n="sourceBing">Bing 翻譯</option>
          <option value="deepl-api" data-i18n="sourceDeepL">DeepL API</option>
          <option value="llm" data-i18n="sourceLlm">AI 翻譯</option>
        </select>
      </span>
    </label>
    <label class="row">
      <span class="icon">🎯</span>
      <span class="label" data-i18n="targetLanguage">翻譯成</span>
      <span class="pill">
        <select id="targetLanguage">
          <option value="zh-TW" data-i18n="langZhTW">繁體中文</option>
          <option value="en" data-i18n="langEn">英文</option>
          <option value="ja" data-i18n="langJa">日文</option>
          <option value="ko" data-i18n="langKo">韓文</option>
        </select>
      </span>
    </label>
    <p id="sourceWarning" class="warning hidden"></p>
  </div>

  <div class="card">
    <div class="row">
      <span class="icon">⭐</span>
      <span class="label"><span data-i18n="alwaysTranslate">總是翻譯此網站</span><small id="alwaysTranslateHost"></small></span>
      <span class="switch"><input type="checkbox" id="alwaysTranslateCheckbox"><span class="slider"></span></span>
    </div>
    <div class="row">
      <span class="icon">🖱️</span>
      <span class="label"><span data-i18n="mouseTrigger">滑鼠觸發翻譯</span><small id="triggerHint"></small></span>
      <span class="switch"><input type="checkbox" id="toggleTranslation"><span class="slider"></span></span>
    </div>
    <div class="row" data-i18n-title="youTubeSubtitlesHint">
      <span class="icon">🎬</span>
      <span class="label" data-i18n="youTubeSubtitles">YouTube 字幕</span>
      <div id="youTubeSubtitleMode" class="segmented small">
        <button type="button" data-value="bilingual" data-i18n="youTubeModeBilingual">雙語</button>
        <button type="button" data-value="translation" data-i18n="youTubeModeTranslation">只譯文</button>
      </div>
      <span class="switch"><input type="checkbox" id="enableYouTubeSubtitles"><span class="slider"></span></span>
    </div>
  </div>

  <footer>
    <div class="links">
      <button id="openGlossaryBtn" class="link" type="button" data-i18n="glossary">術語表</button>
      <button id="openVocabularyBtn" class="link" type="button" data-i18n="vocabulary">生字本</button>
      <button id="manageSitesBtn" class="link" type="button" data-i18n="sites">網站清單</button>
      <button id="clearBtn" class="link" type="button" data-i18n="clearTriggered">清除觸發譯文</button>
    </div>
    <span id="version" class="version"></span>
  </footer>

  <script src="language.js"></script>
  <script src="sitePatterns.js"></script>
  <script src="ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>

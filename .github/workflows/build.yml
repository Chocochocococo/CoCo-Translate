name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Build Chrome & Firefox packages
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: coco-translate-packages
          path: |
            dist/*.zip
            dist/*.xpi

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Import Regex Patterns</title>
  <style>
    /* 一點簡單的美化 */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f9f9f9;
      color: #333;
      line-height: 1.5;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 10px;
      color: #2c3e50;
    }
    p {
      margin-bottom: 15px;
    }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      font-size: 14px;
      color: #fff;
      background-color: #3498db;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
    }
    .btn:hover {
      background-color: #2980b9;
    }
    #importFile {
      display: none; /* 隱藏檔案選擇器，用按鈕來觸發 */
    }
  </style>
</head>
<body>
  <h1 id="Importrexgexpatternsid">Import Regex Patterns</h1>
  <p><span id="Importrexgexpatternsdesid">Select your custom Regular Expression JSON file and load it into the extension. Importing will overwrite the existing patterns.</span></p>

  <!-- 用檔案選擇器+按鈕的組合 -->
  <input type="file" id="importFile" accept=".json">
  <button id="importBtn" class="btn">Import Regex File</button>
  <script src="language.js"></script>
  <script src="options.js"></script>
</body>
</html>

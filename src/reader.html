<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoCo 文件翻譯</title>
  <!-- theme.js 要最先跑，打開時才不會先閃一下白色 -->
  <script src="theme.js"></script>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="reader.css">
</head>
<!-- coco-reader：整頁翻譯、滑鼠觸發翻譯都跳過整頁（譯文是我們自己排的），但選字還是可以查單字 -->
<body class="coco-reader">
  <header class="reader-bar">
    <img src="icons/icon-48.png" alt="" class="logo">
    <div class="title-block">
      <div id="docName" class="doc-name" data-i18n="readerTitle">文件翻譯</div>
      <div id="status" class="status" aria-live="polite"></div>
    </div>
    <button id="openFileBtn" class="btn secondary small" type="button" data-i18n="readerOpen">開啟檔案</button>
    <button id="exportAltBtn" class="btn secondary small hidden" type="button" disabled>匯出譯文字幕</button>
    <button id="exportBtn" class="btn small" type="button" disabled>匯出雙語文字檔</button>
    <input type="file" id="fileInput" accept=".pdf,.docx,.epub,.txt,.text,.md,.srt,.vtt,application/pdf,application/epub+zip,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,text/vtt" hidden>
  </header>

  <main id="readerMain" class="reader-main">
    <section id="dropZone" class="drop-zone">
      <div class="drop-card">
        <div class="drop-icon" aria-hidden="true">📄</div>
        <h1 data-i18n="readerDropTitle">把文件拖到這裡</h1>
        <p data-i18n="readerDropHint"></p>
        <p class="privacy" data-i18n="readerPrivacy"></p>
        <p id="dropError" class="warning hidden"></p>
        <!-- 打不開電腦裡的檔案（file://）時：選一次檔案；Chrome 另外教怎麼打開權限，以後就能直接翻 -->
        <div id="localFileHelp" class="local-help hidden">
          <p id="localFileText" class="local-text"></p>
          <div class="local-actions">
            <button id="pickLocalBtn" class="btn" type="button" data-i18n="readerPickFile">選擇檔案</button>
            <button id="allowFilesBtn" class="btn secondary hidden" type="button" data-i18n="readerAllowFiles">以後直接開啟</button>
          </div>
          <p id="allowFilesSteps" class="local-steps hidden" data-i18n="readerAllowFilesSteps"></p>
        </div>
      </div>
    </section>
    <section id="pdfPane" class="pane pdf-pane hidden" aria-label="PDF"></section>
    <section id="textPane" class="pane text-pane hidden"></section>
  </main>

  <!-- content.js 帶來選字工具列、單字卡、生字本、朗讀，還有翻譯請求 -->
  <script src="language.js"></script>
  <script src="markup.js"></script>
  <script src="sitePatterns.js"></script>
  <script src="content.js"></script>
  <script src="docparse.js"></script>
  <script src="docformats.js"></script>
  <script type="module" src="reader.js"></script>
</body>
</html>
